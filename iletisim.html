    <main id="app" class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="contact-card shadow-sm">
                    <h3 class="text-center mb-4" style="color: #ff4d6d;">📬 İletişim Formu</h3>

                   <form id="contactForm" ref="myform" action="iletisim_kontrol.php" method="POST">
                        <div class="mb-3">
                            <label class="form-label">Ad Soyad:</label>
                            <input type="text" id="name" name="name" v-model="formData.name" class="form-control"
                                placeholder="Adınız...">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">E-posta:</label>
                            <input type="text" id="email" name="email" v-model="formData.email" class="form-control"
                                placeholder="e-posta@adresiniz.com">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Telefon:</label>
                            <input type="text" id="phone" name="phone" v-model="formData.phone" class="form-control"
                                placeholder="05XXXXXXXXX">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Cinsiyet:</label>

                            <div class="form-control d-flex gap-4 p-2 ps-3 bg-white">
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="gender" id="erkek"
                                        v-model="formData.gender" value="erkek">
                                    <label class="form-check-label" for="erkek">Erkek</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="gender" id="kadin"
                                        v-model="formData.gender" value="kadin">
                                    <label class="form-check-label" for="kadin">Kadın</label>
                                </div>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Şehir:</label>
                            <select class="form-control bg-white" name="city" v-model="formData.city" id="city">
                                <option value="">Yaşadığınız şehri seçiniz...</option>
                                <option value="74">Bartın</option>
                                <option value="01">Adana</option>
                                <option value="54">Sakarya</option>
                                <option value="35">İzmir</option>
                                <option value="34">İstanbul</option>
                                <option value="06">Ankara</option>
                                <option value="diger">Diğer</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Mesajınız:</label>
                            <textarea id="message" name="message" v-model="formData.message" class="form-control" rows="3"></textarea>
                        </div>

                        <div class="row g-2 mt-4">
                            <div class="col-md-6">
                                <button type="button" onclick="validateWithJS()" class="btn btn-js w-100 p-3 shadow-sm">
                                    JS ile Denetle & Gönder
                                </button>
                            </div>
                            <div class="col-md-6">
                                <button type="button" @click="validateWithVue" class="btn btn-vue w-100 p-3 shadow-sm">
                                    Vue.js ile Denetle & Gönder
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <script>
       // 1. YÖNTEM: PURE JAVASCRIPT DENETİMİ
    function validateWithJS() {
        const name = document.getElementById('name').value;
        const email = document.getElementById('email').value;
        const phone = document.getElementById('phone').value;
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        const phoneRegex = /^[0-9]+$/;

        if (!name || !email || !phone) {
            alert("Hata (JS): Tüm alanlar doldurulmalıdır!");
        } else if (!emailRegex.test(email)) {
            alert("Hata (JS): E-posta formatı geçersiz!");
        } else if (!phoneRegex.test(phone)) {
            alert("Hata (JS): Telefon sadece rakamlardan oluşmalıdır!");
        } else {
            alert("Başarılı (JS): Verileriniz denetlendi ve gönderildi! ✨");
            document.getElementById('contactForm').submit();
        }
    }

    // 2. YÖNTEM: VUE.JS FRAMEWORK DENETİMİ
    const { createApp } = Vue;
    createApp({
        data() {
            return {
                formData: { name: '', email: '', phone: '', message: '', gender: 'erkek', city: '' }
            }
        },
        // SİHİRLİ TEST KISMI BURASI:
        mounted() {
            alert("VUE.JS HAYATTA! 🎉 Eğer bu mesajı görüyorsan sağdaki buton artık çalışacaktır!");
        },
        methods: {
            validateWithVue() {
                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                const phoneRegex = /^[0-9]+$/;

                if (!this.formData.name || !this.formData.email || !this.formData.phone) {
                    alert("Hata (Vue.js): Alanları boş bırakmayınız!");
                } else if (!emailRegex.test(this.formData.email)) {
                    alert("Hata (Vue.js): Geçersiz e-posta!");
                } else if (!phoneRegex.test(this.formData.phone)) {
                    alert("Hata (Vue.js): Telefon sadece rakam olmalı!");
                } else {
                    alert("Başarılı (Vue.js): Denetim tamamlandı, PHP'ye yönleniyor! 🚀");
                    const formElement = document.getElementById('contactForm');
                    if (formElement) formElement.submit();
                }
            }
        }
    }).mount('#app');
    </script>
